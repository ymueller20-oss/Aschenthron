<title>Aschenthron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@500;700;800&family=Alegreya+Sans+SC:wght@700;800&family=Goudy+Bookletter+1911&family=EB+Garamond:ital,wght@0,500;0,700;1,500&display=swap">
<style>
/* Layout: one-screen duel table — enemy bar, enemy board, rune divider, your board, your bar, your hand fanned at the bottom. Single dark look by design. */
:root{
  --void:#0b0908; --table:#1a1512; --stone:#2b241f; --bone:#e3d7be; --bone-2:#a89b83; --ink:#1d1712;
  --ember:#e0873a; --blood:#b3322a; --mana:#4b7cc2; --gold:#c9a45a; --gold-dim:#6e5a34;
  --ready:#a9d46b; --tgt:#ff6a3d;
  --f-name:'IM Fell English SC', 'Iowan Old Style', Georgia, serif;
  --f-flav:'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --f-ui:'Alegreya Sans', system-ui, sans-serif;
  --f-num:'Alegreya Sans SC', 'Alegreya Sans', system-ui, sans-serif;
  --f-card:'Goudy Bookletter 1911', 'Iowan Old Style', Georgia, serif;
  --f-rules:'EB Garamond', Georgia, serif;
  --mw:52px; --hw:76px; --hero:66px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--void);color:var(--bone);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#nav{box-sizing:border-box;flex:none;display:flex;justify-content:center;gap:6px;padding:6px 16px 0;width:100%;max-width:820px;margin:0 auto;background:#0e0b0a;box-shadow:inset 0 -1px 0 rgba(201,164,90,.15)}
#nav button{font:800 .78rem/1 var(--f-num);letter-spacing:.14em;text-transform:uppercase;padding:9px 16px 10px;color:var(--bone-2);border-bottom:2px solid transparent}
#nav button[aria-pressed="true"]{color:var(--gold);border-bottom-color:var(--gold)}
#app[hidden],#poker[hidden]{display:none!important}
#app{position:relative;flex:1;min-height:0;width:100%;max-width:820px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr) auto auto;
  background:
    radial-gradient(ellipse 70% 40% at 50% 50%, rgba(201,164,90,.07), transparent 70%),
    repeating-linear-gradient(93deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px),
    radial-gradient(ellipse at 50% 50%, #2a221d 0%, #16110f 60%, #0b0908 100%);
  box-shadow:0 0 60px rgba(0,0,0,.8);overflow:hidden}

/* bars */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:8px 16px}
.info{justify-self:end;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
.who{font-family:var(--f-name);font-size:.95rem;letter-spacing:.03em;color:var(--bone);white-space:nowrap}
.mana{font:800 .95rem/1 var(--f-num);color:#a9c8f2;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.gem{width:10px;height:10px;transform:rotate(45deg);background:radial-gradient(#d5e6ff,#4b7cc2 60%,#1d3560);box-shadow:0 0 6px rgba(120,170,240,.6)}
.crys{display:flex;gap:3px}
.crys i{width:7px;height:7px;transform:rotate(45deg);background:#141c28;box-shadow:inset 0 0 0 1px #33496a}
.crys i.on{background:radial-gradient(#cfe2ff,#4b7cc2 60%,#1f3a66);box-shadow:0 0 4px rgba(120,170,240,.7)}
.meta{font-size:.72rem;color:var(--bone-2);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.backs{display:flex;padding-left:6px;min-height:20px}
.backs i{width:14px;height:20px;margin-left:-6px;border-radius:2px;background:radial-gradient(circle at 50% 46%, #7a2c22 0 20%, transparent 22%),linear-gradient(135deg,#2c1f19,#110b09);box-shadow:0 0 0 1px #000, inset 0 0 0 1.5px #5c4733}
.power-slot{justify-self:start;display:flex;flex-direction:column;align-items:center;gap:3px}
.plabel{font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--bone-2)}

/* hero */
.hero{position:relative;width:var(--hero);height:calc(var(--hero)*1.14);display:block}
.hero-art{position:absolute;inset:0;border-radius:50% 50% 14% 14% / 42% 42% 10% 10%;overflow:hidden;
  box-shadow:0 0 0 3px #0b0908, 0 0 0 5px var(--gold-dim), 0 0 0 6px #0b0908, 0 8px 18px rgba(0,0,0,.8)}
.hero-art img{width:100%;height:100%;object-fit:cover;display:block}
.hp{position:absolute;right:-8px;bottom:-6px;width:30px;height:34px;display:grid;place-items:center;
  font:800 1.05rem/1 var(--f-num);color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000;
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:radial-gradient(circle at 40% 35%,#e46e5c,#8e1d16 55%,#2e0806);
  box-shadow:0 0 0 2px #120a08, 0 2px 6px rgba(0,0,0,.8);font-variant-numeric:tabular-nums}
.hp.hurt{color:#ffc9bf}
.hero::after,.power::after{content:'';position:absolute;inset:-5px;border-radius:50% 50% 16% 16% / 42% 42% 10% 10%;pointer-events:none;transition:box-shadow .2s}
.power::after{border-radius:50%}
.hero.tgt::after,.power.armed::after{box-shadow:0 0 0 2px var(--tgt),0 0 18px var(--tgt);animation:throb 1s infinite}
.power.armed::after{box-shadow:0 0 0 2px var(--ember),0 0 18px var(--ember)}

/* hero power */
.power{position:relative;width:calc(var(--hero)*.66);height:calc(var(--hero)*.66);border-radius:50%;display:block}
.power .pa{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px #0b0908,0 0 0 4px var(--gold-dim),0 4px 10px rgba(0,0,0,.8)}
.power img{width:100%;height:100%;object-fit:cover;display:block}
.power .pc{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font:800 .8rem/1 var(--f-num);color:#fff;background:radial-gradient(#7fa6dd,#2a4a80 60%,#0c1830);box-shadow:0 0 0 1.5px #0b0908}
.power.used .pa{filter:grayscale(1) brightness(.45)}
.power.can .pa{box-shadow:0 0 0 2px #0b0908,0 0 0 4px var(--ready),0 0 14px rgba(169,212,107,.5)}

/* boards */
.board{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;min-height:calc(var(--mw)*1.34 + 22px)}
.board.e{background:linear-gradient(180deg,transparent,rgba(0,0,0,.18))}
.board.p{background:linear-gradient(0deg,transparent,rgba(0,0,0,.18))}
.mid{display:flex;align-items:center;gap:10px;padding:0 16px;height:42px;position:relative}
.mid::before{content:'';position:absolute;left:16px;right:16px;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(201,164,90,.35) 20%,rgba(201,164,90,.35) 80%,transparent)}
#log{position:relative;flex:0 1 auto;min-width:0;margin-right:auto;font-family:var(--f-flav);font-style:italic;font-size:.88rem;color:var(--bone-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--table);padding:3px 8px;justify-self:start;max-width:max-content;border-radius:3px}
#log.hint{color:var(--ember);font-style:normal;font-family:var(--f-ui);font-weight:700}
.chip{position:relative;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:3px;background:#2a221d;color:var(--bone);box-shadow:inset 0 0 0 1px #5c4a36}
#endturn{position:relative;flex:none;font:800 .8rem/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:4px;
  color:#ffe1b8;background:linear-gradient(#6a3a1c,#3a1d0d);box-shadow:inset 0 1px 0 rgba(255,220,170,.25),0 0 0 1px #0b0908,0 0 0 2px #8a5a2a,0 4px 10px rgba(0,0,0,.6)}
#endturn.done{background:linear-gradient(#5d7a2c,#2f4414);color:#eaffc8;box-shadow:inset 0 1px 0 rgba(230,255,190,.25),0 0 0 1px #0b0908,0 0 0 2px #8db04a,0 0 16px rgba(169,212,107,.45);animation:throb 1.6s infinite}
#endturn:disabled{background:linear-gradient(#2a2420,#1a1512);color:var(--bone-2);box-shadow:0 0 0 1px #0b0908,0 0 0 2px #3b322b;cursor:default}

/* minion on board */
.mn{position:relative;width:var(--mw);height:calc(var(--mw)*1.34);font-size:calc(var(--mw)/5.2);flex:none;transition:transform .18s}
.mn-taunt{position:absolute;inset:-11% -15% -6%;clip-path:polygon(50% 0,100% 9%,97% 62%,50% 100%,3% 62%,0 9%);
  background:linear-gradient(170deg,#857155,#3a2f24 45%,#16120e)}
.mn-body{position:absolute;inset:0;border-radius:48% 48% 10% 10% / 32% 32% 8% 8%;overflow:hidden;background:#000;
  box-shadow:0 0 0 .14em #0b0908,0 0 0 .32em #5c4a36,0 .5em 1em rgba(0,0,0,.75)}
.mn-body img{width:100%;height:100%;object-fit:cover;display:block}
.mn::after{content:'';position:absolute;inset:-.45em;border-radius:48% 48% 14% 14% / 32% 32% 10% 10%;pointer-events:none;transition:box-shadow .2s}
.mn.ready::after{box-shadow:0 0 0 .18em var(--ready),0 0 1em rgba(169,212,107,.6)}
.mn.sel{transform:translateY(-8px) scale(1.06)}
.mn.sel::after{box-shadow:0 0 0 .22em #fff3c4,0 0 1.4em rgba(255,230,150,.9)}
.mn.tgt::after{box-shadow:0 0 0 .2em var(--tgt),0 0 1.2em var(--tgt);animation:throb 1s infinite}
.mn.shield .mn-body{box-shadow:0 0 0 .14em #0b0908,0 0 0 .32em #c9a45a,0 0 1.1em rgba(255,222,150,.75)}
.mn.shield .mn-body::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(ellipse at 50% 30%,rgba(255,236,190,.28),transparent 70%);box-shadow:inset 0 0 .9em .25em rgba(255,226,150,.8)}
.mn-atk,.mn-hp{position:absolute;bottom:-.55em;width:1.75em;height:1.75em;display:grid;place-items:center;font:800 1.15em/1 var(--f-num);color:#fff;
  text-shadow:0 1px 0 #000,0 0 3px #000;font-variant-numeric:tabular-nums;z-index:2}
.mn-atk{left:-.45em;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f0aa5c,#9c4a18 55%,#3a1408);box-shadow:0 0 0 .12em #120a08}
.mn-hp{right:-.45em;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:radial-gradient(circle at 40% 35%,#e46e5c,#8e1d16 55%,#2e0806);box-shadow:0 0 0 .12em #120a08}
.up{color:#c8f59a!important}
.down{color:#ffb3a6!important}
.mn-marks{position:absolute;left:0;right:0;bottom:1.1em;display:flex;justify-content:center;gap:.25em}
.mk{width:.75em;height:.75em;border-radius:50%;box-shadow:0 0 0 .1em #000}
.mk.poison{background:radial-gradient(#c8f07a,#3d6a14)}
.mk.life{background:radial-gradient(#ff9a8a,#8e1d16)}
.mk.dr{background:radial-gradient(#e9dfc6,#6b604c);border-radius:40% 40% 30% 30%}
.zz{position:absolute;top:.2em;right:.3em;font:italic 1.1em/1 var(--f-flav);color:#d8ccb4;text-shadow:0 0 4px #000;z-index:2}
.mn.enter{animation:enter .45s cubic-bezier(.2,.9,.3,1.2)}
.empty{font-family:var(--f-flav);font-style:italic;color:rgba(169,155,131,.38);font-size:.9rem;text-align:center}

/* hand */
#hand{position:relative;height:calc(var(--hw)*1.4 + 14px);margin:0 16px}
.hc{position:absolute;bottom:6px;transform-origin:50% 130%;transition:left .25s, transform .2s}
.hc.lift{transform:translateY(-14px)!important;z-index:20}
.hc.playable .card{--glow:0 0 0 .14em var(--ready),0 0 .9em rgba(169,212,107,.6)}

/* card */
.card{position:relative;width:var(--w);height:calc(var(--w)*1.4);font-size:calc(var(--w)/10);border-radius:.55em;overflow:hidden;color:var(--bone);
  background:
    radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.06),transparent 60%),
    linear-gradient(165deg,color-mix(in srgb,var(--tint) 45%,#17120f) 0%,#0f0c0a 55%,color-mix(in srgb,var(--tint) 30%,#0e0b09) 100%);
  box-shadow:0 0 0 .08em #000,inset 0 0 0 .14em color-mix(in srgb,var(--tint) 60%,#3a3229),inset 0 0 1.4em rgba(0,0,0,.85),0 .4em 1.1em rgba(0,0,0,.65),var(--glow,0 0 0 transparent)}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.35;
  background:repeating-radial-gradient(circle at 20% 30%,rgba(255,255,255,.03) 0 1px,transparent 1px 3px),repeating-linear-gradient(37deg,rgba(0,0,0,.18) 0 1px,transparent 1px 4px)}
.c-cost{position:absolute;left:.18em;top:.18em;width:2.15em;height:2.15em;border-radius:50%;display:grid;place-items:center;z-index:3;
  background:radial-gradient(circle at 38% 32%,#a9c7f0,#3a62a0 45%,#0c1830 100%);box-shadow:0 0 0 .1em #0b0908,0 0 0 .2em var(--gold-dim),0 .15em .4em rgba(0,0,0,.8)}
.c-cost span{font:800 1.4em/1 var(--f-num);color:#fff;text-shadow:0 .05em 0 #000,0 0 .2em #000}
.c-name{position:absolute;left:1.6em;right:.45em;top:.48em;height:1.35em;border-radius:.2em;padding-left:.75em;display:flex;align-items:center;z-index:2;
  background:linear-gradient(#433a30,#1e1915);box-shadow:inset 0 .06em 0 rgba(255,255,255,.14),inset 0 -.06em 0 #000,0 .06em .15em #000}
.c-name span{font-family:var(--f-name);font-size:.78em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em;text-shadow:0 .06em 0 #000}
.legend .c-name{box-shadow:inset 0 0 0 .07em var(--gold),inset 0 .06em 0 rgba(255,255,255,.2),0 0 .5em rgba(201,164,90,.4)}
.c-art{position:absolute;left:.55em;right:.55em;top:2.05em;height:5.6em;background:#000;box-shadow:0 0 0 .1em #000,0 0 0 .16em color-mix(in srgb,var(--tint) 40%,#4a3f33);border-radius:.08em;overflow:hidden}
.c-art img{width:100%;height:100%;object-fit:cover;display:block}
.c-type{position:absolute;left:.45em;right:.45em;top:7.8em;height:1.1em;border-radius:.15em;display:flex;align-items:center;padding-left:.6em;
  background:linear-gradient(#3a322a,#1a1612);box-shadow:inset 0 .05em 0 rgba(255,255,255,.1),0 .05em .12em #000}
.c-type span{font-size:.5em;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-2);font-weight:700}
.c-text{position:absolute;left:.6em;right:.6em;top:9.05em;bottom:.6em;border-radius:.15em;display:flex;align-items:center;justify-content:center;text-align:center;padding:.3em 1.2em .3em;
  background:linear-gradient(175deg,#ddd2b8,#c2b596 70%,#a99b7c);color:var(--ink);box-shadow:inset 0 0 .6em rgba(80,60,30,.5),0 0 0 .07em #000}
.spell .c-text{padding-inline:.6em}
.c-text p{font-size:.62em;line-height:1.28;margin:0}
.c-text b{font-weight:800}
.c-text .flav{font-family:var(--f-flav);font-style:italic;font-size:.55em;color:#54473a;margin-top:.45em}
.c-atk,.c-hp{position:absolute;bottom:.08em;width:2.05em;height:2.05em;display:grid;place-items:center;z-index:3}
.c-atk{left:.08em;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f0aa5c,#9c4a18 55%,#3a1408);box-shadow:0 0 0 .1em #0b0908,0 0 0 .18em var(--gold-dim)}
.c-hp{right:.08em;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:radial-gradient(circle at 40% 35%,#e46e5c,#8e1d16 55%,#2e0806);box-shadow:0 0 0 .1em #0b0908,0 0 0 .18em var(--gold-dim)}
.c-atk span,.c-hp span{font:800 1.3em/1 var(--f-num);color:#fff;text-shadow:0 .05em 0 #000,0 0 .2em #000}
.mini .c-type,.mini .c-text{display:none}
.mini .c-art{height:auto;bottom:.55em}
.mini .c-name{left:.35em;right:.35em;top:auto;bottom:2.35em;height:1.7em;padding:0 .3em;justify-content:center}
.mini .c-name span{font-size:1.02em}
.mini .c-cost{width:2.6em;height:2.6em}
.mini .c-cost span{font-size:1.6em}
.mini .c-atk,.mini .c-hp{width:2.4em;height:2.4em}
.mini .c-atk span,.mini .c-hp span{font-size:1.5em}

/* overlays */
#ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(5,4,3,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.pv{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:340px;width:100%;animation:rise .25s ease-out}
.pv-act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font:800 .85rem/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;padding:12px 18px;border-radius:4px;color:var(--bone);
  background:linear-gradient(#3a3029,#201a16);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 0 0 1px #0b0908,0 0 0 2px #5c4a36}
.btn.primary{color:#eaffc8;background:linear-gradient(#5d7a2c,#2f4414);box-shadow:inset 0 1px 0 rgba(230,255,190,.25),0 0 0 1px #0b0908,0 0 0 2px #8db04a}
.why{margin:0;font-size:.9rem;color:#ffb3a6;align-self:center}
.kws{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.85rem;color:var(--bone-2);text-align:left;width:100%}
.kws b{color:var(--bone)}
.end{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;animation:rise .4s ease-out}
.end h2{font:400 clamp(2.6rem,12vw,4.2rem)/1 var(--f-name);margin:0;color:var(--gold);text-shadow:0 0 30px rgba(201,164,90,.4);text-wrap:balance}
.end.lose h2{color:#c94a3a;text-shadow:0 0 30px rgba(201,74,58,.4)}
.end p{margin:0;font-family:var(--f-flav);font-style:italic;font-size:1.05rem;color:var(--bone-2);max-width:30ch}
#cast{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none}
#cast .who2{font-family:var(--f-name);font-size:1rem;color:var(--bone-2);text-align:center;margin-bottom:10px}
#cast .inner{animation:castin 1.1s ease forwards}
#banner{position:fixed;inset:0;z-index:45;display:grid;place-items:center;pointer-events:none}
#banner span{font:400 clamp(2.2rem,10vw,3.4rem)/1 var(--f-name);color:var(--gold);padding:14px 34px;background:radial-gradient(ellipse,rgba(10,8,7,.92),rgba(10,8,7,0) 75%);
  text-shadow:0 0 24px rgba(201,164,90,.55);animation:banner 1.3s ease forwards}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
.float{position:fixed;transform:translate(-50%,-50%);font:800 1.7rem/1 var(--f-num);color:#ff5a45;text-shadow:0 2px 0 #000,0 0 6px #000,0 0 2px #000;white-space:nowrap}
.float.heal{color:#9be06a}.float.buff{color:#f2d27a;font-size:1.2rem}.float.shield{color:#ffe7a8;font-size:1rem;font-family:var(--f-name)}
.ash{position:fixed;border-radius:40%;background:radial-gradient(circle,rgba(255,140,60,.55),rgba(60,30,20,.5) 45%,transparent 70%)}

/* ===== Rabenblatt ===== */
#poker{position:relative;flex:1;min-height:0;width:100%;max-width:820px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 1fr auto auto;overflow-x:hidden;overflow-y:auto;
  background:
    radial-gradient(ellipse 80% 45% at 50% 46%, rgba(120,40,24,.28), transparent 70%),
    repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 9px),
    radial-gradient(ellipse at 50% 45%, #3a2219 0%, #1c110d 58%, #0b0807 100%)}
.pk-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 16px 4px;font-size:.72rem;color:var(--bone-2);letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.pk-seats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 6px;padding:4px 16px 12px}
.seat:nth-child(1),.seat:nth-child(2),.seat:nth-child(3){grid-column:span 2}.seat:nth-child(4){grid-column:2/span 2}.seat:nth-child(5){grid-column:4/span 2}
.seat{position:relative;display:flex;flex-direction:column;gap:4px;padding:6px 6px 13px;border-radius:6px;background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(201,164,90,.12);min-width:0;transition:opacity .3s,box-shadow .3s}
.seat.turn{box-shadow:inset 0 0 0 1.5px var(--gold),0 0 16px rgba(201,164,90,.35)}
.seat.fold{opacity:.4}
.seat.out{opacity:.22}
.seat.win{box-shadow:inset 0 0 0 2px var(--ready),0 0 18px rgba(169,212,107,.45)}
.seat-h{display:flex;align-items:center;gap:6px;min-width:0;padding-right:14px}
.sw{min-width:0;display:flex;flex-direction:column;gap:2px}
.av{width:30px;height:30px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 1.5px #0b0908,0 0 0 3px var(--gold-dim)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.sn{font-family:var(--f-name);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.gold{font:800 .9rem/1 var(--f-num);color:var(--gold);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.gold::before{content:'';width:.7em;height:.7em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f6dc92,#a77c2c 60%,#4a3410);box-shadow:0 0 0 1px #2a1d0a}
.sw .gold{font-size:.78rem}
.srow{display:flex;gap:3px;align-items:center;min-height:31px;min-width:0}
.srow{flex-wrap:wrap}
.srow .sact{flex:1 1 64px;min-width:0;padding-left:3px}
.disc{display:inline-block;position:relative;opacity:.9;flex:none}
.disc .pk{box-shadow:0 0 0 1px #000,inset 0 0 0 .22em #8e1d16}
.disc::after{content:'';position:absolute;left:10%;right:10%;top:50%;height:2px;background:#d24a3e;transform:rotate(-30deg);box-shadow:0 0 3px #000}
.pk-info .disc{margin-left:0}
.sact{font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--bone);min-height:1.1em;line-height:1.25;max-width:100%;overflow-wrap:anywhere}
.sbet{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);padding:2px 7px;border-radius:10px;background:#120c09;box-shadow:0 0 0 1px var(--gold-dim);z-index:2}
.sbet .gold{font-size:.74rem}
.dlr{position:absolute;top:5px;right:5px;width:16px;height:16px;border-radius:50%;background:var(--bone);color:var(--ink);font:800 .6rem/16px var(--f-num);text-align:center;box-shadow:0 1px 3px #000}
.pk-a,.pk-h{position:absolute;bottom:.3em;z-index:3;width:1.75em;height:1.75em;display:grid;place-items:center;font:800 1.3em/1 var(--f-num);color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000;font-variant-numeric:tabular-nums}
.pk-a{left:.3em;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f0aa5c,#9c4a18 55%,#3a1408);box-shadow:0 0 0 .08em #120a08}
.pk-h{right:.3em;border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:radial-gradient(circle at 40% 35%,#e46e5c,#8e1d16 55%,#2e0806);box-shadow:0 0 0 .08em #120a08}
.pk .pk-n{bottom:2.7em}
.teamline-old{font-size:.74rem;color:var(--bone-2);text-align:center}
.teamline b{color:var(--bone);font-variant-numeric:tabular-nums}
.pk-board button,.pk-hole button{display:block;border-radius:8px}
.bt{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:rise .25s ease-out}
.bt-team{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.bt-name{font-family:var(--f-name);font-size:1rem;color:var(--bone);text-align:center}
.bt-name span{color:var(--gold)}
.bt-row{display:flex;gap:6px;justify-content:center}
.ft{position:relative;transition:filter .4s,opacity .4s,transform .4s}
.ft.dead{filter:grayscale(1) brightness(.35);opacity:.55;transform:scale(.92)}
.bt-mid{font:400 1.25rem/1 var(--f-name);color:var(--ember);letter-spacing:.04em;padding:6px 0;text-align:center}
.bt-res{font-family:var(--f-flav);font-style:italic;font-size:1.05rem;color:var(--bone);text-align:center;min-height:1.4em}
.pk-table{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:6px 16px 4px;min-width:0}
.pk-board{display:flex;gap:6px}
.pk-pot{display:flex;gap:14px;align-items:baseline}
.pk-pot .gold{font-size:1.15rem}
.pk-pot small{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--bone-2);margin-right:4px}
.pk-log{font-family:var(--f-flav);font-style:italic;color:var(--bone-2);font-size:.95rem;text-align:center;min-height:1.3em;max-width:38ch;text-wrap:balance}
.pk-me{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 16px}
.pk-hole{display:flex;gap:8px;align-items:flex-end}
.pk-hole button{display:block;border-radius:8px}
.pk-hole button.sel .pk{transform:translateY(-12px) rotate(-2deg);box-shadow:0 0 0 .1em #000,inset 0 0 0 .2em var(--blood),0 0 1.2em rgba(220,60,40,.8)}
.pk-info{display:flex;gap:14px;align-items:center;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-2)}
.combo{font-family:var(--f-name);font-size:1.05rem;color:var(--bone);min-height:1.3em;text-align:center}
.combo em{font-style:normal;color:var(--gold)}
.pk-ctrl{position:sticky;bottom:0;z-index:5;background:linear-gradient(transparent,#0e0908 30%);display:flex;gap:8px;padding:8px 16px 12px;flex-wrap:wrap;justify-content:center;min-height:62px;align-items:center}
.pk-ctrl > .btn{flex:1 1 0;min-width:0;padding:14px 6px;font-size:.76rem;letter-spacing:.05em;white-space:nowrap}
.pk-ctrl .msg{font-size:.9rem;color:var(--bone-2);text-align:center;width:100%}
.btn.red{color:#ffd6cc;background:linear-gradient(#6a2a22,#3a1410);box-shadow:inset 0 1px 0 rgba(255,200,180,.18),0 0 0 1px #0b0908,0 0 0 2px #9a4a3a}
.btn.gold{color:#2a1d0a;background:linear-gradient(#e2c27a,#9a7430);box-shadow:inset 0 1px 0 rgba(255,250,220,.5),0 0 0 1px #0b0908,0 0 0 2px #c9a45a}
.btn.gold::before{display:none}
.btn:disabled{opacity:.4;cursor:default}
.raise{display:grid;gap:10px;width:100%}
.raise-top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--bone-2)}
.raise-top .gold{font-size:1.2rem}
.raise input{width:100%;accent-color:var(--gold)}
.raise-pre,.raise-go{display:flex;gap:8px}
.raise-pre .chip,.raise-go .btn{flex:1}
.pk{position:relative;width:var(--w);height:calc(var(--w)*1.4);font-size:calc(var(--w)/10);border-radius:.55em;overflow:hidden;background:#000;flex:none;
  box-shadow:0 0 0 .08em #000,inset 0 0 0 .22em color-mix(in srgb,var(--sc) 70%,#1a1410),0 .3em .8em rgba(0,0,0,.6);transition:transform .25s,filter .3s,box-shadow .3s}
.pk img{position:absolute;left:.22em;top:.22em;width:calc(100% - .44em);height:calc(100% - .44em);object-fit:cover;border-radius:.38em;display:block}
.pk::after{content:'';position:absolute;inset:.22em;border-radius:.38em;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent 32%,transparent 60%,rgba(0,0,0,.88))}
.pk-r{position:absolute;left:.5em;top:.3em;z-index:2;font:400 3em/1 var(--f-name);color:#f3e9d2;text-shadow:0 .05em .1em #000,0 0 .3em #000;font-variant-numeric:tabular-nums}
.pk-s{position:absolute;left:.6em;top:3.4em;z-index:2;width:1.9em;height:1.9em;color:var(--sc);filter:drop-shadow(0 0 .15em #000) drop-shadow(0 0 .15em #000)}
.pk-s svg{width:100%;height:100%;display:block}
.pk-n{position:absolute;left:0;right:0;bottom:.6em;z-index:2;text-align:center;font:400 1.4em/1 var(--f-name);color:var(--bone);text-shadow:0 .05em .1em #000}
.pk.sm .pk-n{display:none}
.pk.sm .pk-r{font-size:4.4em;left:.35em;top:.2em}
.pk.sm .pk-s{top:5.2em;left:.5em;width:3em;height:3em}
.pk.hi{transform:translateY(-5px);box-shadow:0 0 0 .1em #000,inset 0 0 0 .24em var(--gold),0 0 1.2em rgba(255,215,130,.75)}
.pk.dim{filter:brightness(.38) saturate(.5)}
.pk.deal{animation:deal .4s cubic-bezier(.2,.9,.3,1.1) backwards}
.pk-back{width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)/16);flex:none;
  background:radial-gradient(circle at 50% 46%,#7a2c22 0 15%,transparent 17%),radial-gradient(circle at 50% 46%,transparent 0 25%,rgba(201,164,90,.4) 26% 28%,transparent 29%),linear-gradient(135deg,#2c1f19,#110b09);
  box-shadow:0 0 0 1px #000,inset 0 0 0 calc(var(--w)/16) #3a2c20,0 2px 5px rgba(0,0,0,.6)}
.pk-slot{width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)/16);flex:none;box-shadow:inset 0 0 0 1px rgba(201,164,90,.2);background:rgba(0,0,0,.22)}
.rank-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;width:100%}
.rank-list li{display:grid;grid-template-columns:1.6em 1fr;gap:8px;align-items:baseline;font-size:.9rem;color:var(--bone-2)}
.rank-list b{font-family:var(--f-name);font-weight:400;font-size:1.05rem;color:var(--bone)}
.rank-list span{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:800}
.help{max-width:380px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:rise .25s ease-out;padding:4px}
.help h3{margin:0;font:400 1.6rem/1.1 var(--f-name);color:var(--gold)}
.help p{margin:0;font-size:.92rem;line-height:1.45;color:var(--bone-2)}
.help p b{color:var(--bone)}
.pk-legend{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:2px 0 4px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.lg{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:.7rem;color:var(--bone-2);background:rgba(0,0,0,.35);border-radius:4px;padding:4px 7px;box-shadow:inset 0 0 0 1px rgba(201,164,90,.14);white-space:nowrap}
.lg b{color:var(--bone);font-weight:800;letter-spacing:.02em}
.lg i{font-style:normal;color:var(--gold);font-size:.66rem}
.lg-i{width:11px;height:11px;color:var(--sc);display:inline-block}
.lg-i svg{width:100%;height:100%;display:block}
.mrow{display:flex;gap:12px;align-items:flex-start;justify-content:center;width:100%}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.mcol .pk-hole{gap:4px}
.ft.hi .pk{transform:none}
.pk-hole .ft .pk-a,.pk-hole .ft .pk-h,.tm-row .pk-a,.tm-row .pk-h{font-size:2.1em;bottom:.2em}
.pk-hole button.sel .ft .pk{transform:translateY(-6px)}
.tm{display:flex;flex-direction:column;align-items:center;gap:5px}
.tm-h{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);text-align:center}
.tm-row{display:flex;gap:4px}
.tm .pk-a,.tm .pk-h{font-size:2.1em;bottom:.2em}
.tm .pk-a{left:.15em}.tm .pk-h{right:.15em}
.tm-n{font-size:.7rem;color:var(--bone-2);text-align:center}
.bt-notes{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;min-height:2.6em;font-size:.8rem;color:var(--bone);text-align:center;max-width:36ch}
.bt-notes span{white-space:nowrap}
.pk .pk-n{font-family:var(--f-ui);font-weight:800;font-size:1.15em;letter-spacing:.04em;text-transform:uppercase}

/* ===== Rabenblatt hell ===== */
#poker{background:
  radial-gradient(ellipse 90% 60% at 50% 38%, rgba(255,248,226,.85), transparent 70%),
  repeating-linear-gradient(90deg, rgba(120,90,50,.05) 0 2px, transparent 2px 11px),
  linear-gradient(180deg,#e8d9b6 0%,#d9c497 55%,#b89b68 100%)!important;color:#2a1f14}
#nav{background:#efe3c6;box-shadow:inset 0 -1px 0 rgba(120,90,40,.3)}
#nav button{color:#7a6446}
#nav button[aria-pressed="true"]{color:#8a5a12;border-bottom-color:#b07a1e}
.pk-top{color:#5a4630}
.pk-top .chip{background:#f6ecd2;color:#3a2a18;box-shadow:inset 0 0 0 1px #b8975c}
.seat{background:rgba(36,26,18,.86);box-shadow:0 2px 8px rgba(80,50,20,.25),inset 0 0 0 1px rgba(201,164,90,.25);color:var(--bone)}
.seat.fold{opacity:.55}
.pk-table{margin:4px 12px;border-radius:22px;padding:12px 12px 8px;background:radial-gradient(ellipse at 50% 40%,#3f7a62,#255443 70%,#1b3f33);box-shadow:inset 0 0 0 3px #b8914a,inset 0 0 0 5px #5a3e1c,inset 0 0 30px rgba(0,0,0,.35),0 6px 16px rgba(70,40,10,.35)}
.pk-log{color:#e8f0e4}
.pk-me{margin:8px 12px 0;border-radius:14px;padding:10px 8px;background:rgba(36,26,18,.9);box-shadow:0 4px 14px rgba(80,50,20,.3)}
.pk-ctrl{background:linear-gradient(transparent,#c8ad7c 35%)}
.pk-ctrl .msg{color:#3a2a18}
.pk{background:var(--fr,#000);box-shadow:0 0 0 .07em #000,inset 0 0 0 .22em var(--fr,#222),0 .3em .8em rgba(0,0,0,.45)}
.pk::before{content:'';position:absolute;inset:.1em;border-radius:.45em;box-shadow:inset 0 0 0 .06em color-mix(in srgb,var(--sc) 70%,#fff 10%);z-index:4;pointer-events:none}
.lu-row{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap}
.lu{border-radius:8px;transition:transform .15s;opacity:.55}
.lu.on{opacity:1;transform:translateY(-6px)}
.lu.on .pk{box-shadow:0 0 0 .07em #000,inset 0 0 0 .22em var(--gold),0 0 .9em rgba(255,215,130,.8)}
.tm-n b{font-weight:800}

/* ===== Klassischer Sammelkarten-Rahmen ===== */
.pk{border-radius:.55em;background:#0e0c0b;box-shadow:0 .25em .7em rgba(0,0,0,.5);overflow:hidden;font-size:calc(var(--w)/10)}
.pk::before{content:'';position:absolute;inset:.42em;border-radius:.3em;background:var(--tex) center/cover,var(--sc);box-shadow:inset 0 0 0 .06em rgba(255,255,255,.28),inset 0 0 .9em rgba(0,0,0,.5);pointer-events:none;z-index:0}
.pk::after{content:none}
.pk>span{position:absolute;z-index:1}
.pk-name,.pk-type{left:.72em;right:.72em;border-radius:.22em;background:linear-gradient(180deg,var(--bar),color-mix(in srgb,var(--bar) 72%,#3a2a18));box-shadow:inset 0 .07em 0 rgba(255,255,255,.7),inset 0 -.07em 0 rgba(0,0,0,.25),0 0 0 .06em rgba(0,0,0,.65),0 .08em .18em rgba(0,0,0,.55);display:flex;align-items:center}
.pk-name{top:.72em;height:2em;padding:0 3em 0 .45em}
.pk-name>span,.pk-type>span{font:400 1.12em/1 var(--f-card);color:#1c140b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;letter-spacing:.01em}
.pk-gem{top:.38em;right:.42em;width:2.9em;height:2.9em;border-radius:50%;display:grid;place-items:center;z-index:2!important;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.75),transparent 38%),radial-gradient(circle,var(--sc) 30%,color-mix(in srgb,var(--sc) 45%,#000) 100%);
  box-shadow:0 0 0 .1em #0e0c0b,0 0 0 .2em color-mix(in srgb,var(--bar) 85%,#fff),0 .12em .3em #000}
.pk-gem b{font:400 1.7em/1 var(--f-card);color:#fff;text-shadow:0 .05em .08em #000,0 0 .25em #000;font-variant-numeric:tabular-nums}
.pk-art{left:.86em;right:.86em;top:2.95em;bottom:3.15em;background:#000;overflow:hidden;box-shadow:0 0 0 .08em #0e0c0b,0 0 0 .18em rgba(255,255,255,.3),0 0 0 .26em rgba(0,0,0,.4)}
.pk .pk-art img{position:static;inset:auto;width:100%;height:100%;object-fit:cover;border-radius:0;display:block}
.pk-type{bottom:.72em;height:2.05em;padding:0 .2em 0 .45em;justify-content:space-between;gap:.2em}
.pk-type>span{font-size:1em}
.pk-pt{flex:none;font:400 1.15em/1 var(--f-card);color:#1c140b;background:var(--box);padding:.18em .32em;border-radius:.18em;box-shadow:0 0 0 .06em rgba(0,0,0,.65),inset 0 .06em 0 rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
.pk.full .pk-name{top:.75em;height:1.5em;padding-right:2.4em}
.pk.full .pk-name>span{font-size:.9em}
.pk.full .pk-gem{top:.66em;right:.9em;width:1.72em;height:1.72em}
.pk.full .pk-gem b{font-size:1em}
.pk.full .pk-art{top:2.45em;bottom:auto;height:4.4em}
.pk.full .pk-type{top:7.05em;bottom:auto;height:1.3em}
.pk.full .pk-type>span{font-size:.7em}
.pk-set{display:block;width:1em;height:1em;flex:none;color:var(--sc);filter:drop-shadow(0 0 .04em #000) drop-shadow(0 0 .04em #000);margin-right:.2em}
.pk-set svg{width:100%;height:100%;display:block}
.pk-box{left:.95em;right:.95em;top:8.55em;bottom:1.1em;border-radius:.15em;padding:.3em .45em .9em;overflow:hidden;display:flex;flex-direction:column;gap:.22em;justify-content:flex-start;
  background:linear-gradient(170deg,var(--box),color-mix(in srgb,var(--box) 82%,#8a7a5a));box-shadow:inset 0 0 0 .06em rgba(0,0,0,.6),inset 0 0 .6em rgba(120,90,40,.25);color:#1c140b}
.pk-rule{font:500 .47em/1.18 var(--f-rules)}
.pk-rule b{font-weight:700}
.pk-fl{font:italic 500 .45em/1.18 var(--f-rules);color:#3a2c1c}
.pk.full .pk-pt{position:absolute;right:.75em;bottom:.55em;font-size:.8em;z-index:2}
.pk-cr{left:1.1em;bottom:.36em;font:400 .42em/1 var(--f-card);color:var(--ink);opacity:.85;letter-spacing:.04em;white-space:nowrap}
.pk.sm::before{inset:.28em;border-radius:.25em}
.pk.sm .pk-art{left:.5em;right:.5em;top:.5em;bottom:.5em;box-shadow:0 0 0 .08em #0e0c0b}
.pk.sm .pk-gem{top:.25em;left:.25em;right:auto;width:4.3em;height:4.3em;box-shadow:0 0 0 .18em #0e0c0b}
.pk.sm .pk-gem b{font-size:2.6em}
.pk.hi{box-shadow:0 0 0 .14em var(--gold),0 0 1.2em rgba(255,215,130,.8)}
.ft .pk-a,.ft .pk-h{z-index:3}
/* Duell-Karten im gleichen Stil */
.card{background:#0e0c0b!important;box-shadow:0 .4em 1.1em rgba(0,0,0,.6),var(--glow,0 0 0 transparent)!important}
.card::before{content:'';position:absolute;inset:.32em;border-radius:.3em;background:var(--tex) center/cover,var(--tint);opacity:1;box-shadow:inset 0 0 0 .06em rgba(255,255,255,.25),inset 0 0 .9em rgba(0,0,0,.45)}
.card>div{z-index:1}
.card .c-name,.card .c-type{background:linear-gradient(180deg,#f2e8d0,#cbbd9c);box-shadow:inset 0 .07em 0 rgba(255,255,255,.7),0 0 0 .06em rgba(0,0,0,.65),0 .08em .18em rgba(0,0,0,.55)}
.card .c-name span{font-family:var(--f-card);color:#1c140b;text-shadow:none;font-size:.82em}
.card .c-type span{color:#2a1f12;font-family:var(--f-card);letter-spacing:.02em;text-transform:none;font-size:.6em;font-weight:400}
.card .c-art{box-shadow:0 0 0 .08em #0e0c0b,0 0 0 .18em rgba(255,255,255,.3)}
.card .c-text{background:linear-gradient(170deg,#f3ead6,#d9cbab);font-family:var(--f-rules)}
.card .c-text p{font-size:.64em}
.card .c-text .flav{font-family:var(--f-rules);font-style:italic}
.card .c-cost span,.card .c-atk span,.card .c-hp span{font-family:var(--f-card);font-weight:400}

/* ===== Werkstatt ===== */
#werk{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:820px;margin:0 auto;background:linear-gradient(180deg,#efe3c6,#d9c497);color:#2a1f14}
.wk-in{padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
.wk-in h2{margin:0;font:400 1.8rem/1.1 var(--f-card);color:#3a2610}
.wk-lead,.wk-note{margin:0;font-size:.92rem;line-height:1.45;color:#4a3820;max-width:60ch}
.wk-lead b{color:#8a4a10}
.wk-warn{margin:0;padding:8px 10px;border-radius:6px;background:#f6e6c4;box-shadow:inset 0 0 0 1px #c8a060;font-size:.85rem}
.wk-tabs{display:flex;gap:6px;flex-wrap:wrap}
.wk-tabs .chip{background:#f6ecd2;color:#3a2a18;box-shadow:inset 0 0 0 1px #b8975c}
.wk-tabs .chip.on{background:#3a2a18;color:#f6ecd2}
.wk-count{margin:0;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:#6a5434}
.wk-busy{margin:0;font-weight:700;color:#8a4a10}
.wk-batch{display:flex;flex-direction:column;gap:10px;background:rgba(255,250,236,.55);border-radius:12px;padding:12px;box-shadow:inset 0 0 0 1px rgba(150,110,50,.25)}
.wk-bh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.wk-act{display:flex;gap:8px;flex-wrap:wrap}

function paint(key,art,W,H){
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const r=rng(hashStr(key)),h=art.hue,[lx,ly]=art.l||[.5,.35];
  const P={W,H,h,r,lx:lx*W,ly:ly*H,art,glow:hs(h+15,70,62,.8),head:null};
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,hs(h,22,6));g.addColorStop(.5,hs(h,28,16));g.addColorStop(1,hs(h,18,5));x.fillStyle=g;x.fillRect(0,0,W,H);
  g=x.createRadialGradient(P.lx,P.ly,0,P.lx,P.ly,W*.75);g.addColorStop(0,hs(h+18,55,58,.55));g.addColorStop(.35,hs(h+8,45,32,.25));g.addColorStop(1,hs(h,40,10,0));x.fillStyle=g;x.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){const rw=W*(.25+r()*.4);cloud(x,r()*W,r()*H*.55,rw,rw*.22,hs(h,15,r()<.5?4:32,.16+r()*.2))}
  (art.back||[]).forEach(m=>M[m]&&M[m](x,P));
  if(!art.noRidge){ridge(x,P,H*.62,H*.08,hs(h,22,11,.95));fog(x,P,H*.64,H*.1,.22);ridge(x,P,H*.82,H*.05,hs(h,25,4,1))}
  (art.front||[]).forEach(m=>M[m]&&M[m](x,P));
  const id=x.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(r()-.5)*22;d[i]+=n;d[i+1]+=n;d[i+2]+=n}x.putImageData(id,0,0);
  g=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.72)');x.fillStyle=g;x.fillRect(0,0,W,H);
  return cv.toDataURL('image/jpeg',.86);
}
const ART={};for(const k in C)ART[k]=paint(k,C[k].art,240,210);
const HART={p:paint('hp',HEROES.p.art,200,220),e:paint('he',HEROES.e.art,200,220)};

/* ---------- Spielzustand ---------- */
let S,busy=false,sel=null,TG=new Set(),HW=76;const NEW=new Set();let FXQ=[],GHOSTS=[];
const opp=s=>s==='p'?'e':'p';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function mkSide(){return{hp:30,max:30,mana:0,maxMana:0,deck:shuffle([...DECK]),hand:[],board:[],fatigue:0,power:false}}
function log(t){S.log=t}
function ent(ref){const[s,u]=ref.split(':');if(u==='H')return S[s];return S[s].board.find(m=>m.uid==u)}
const isHero=ref=>ref.endsWith(':H');
function rectOf(ref){const el=document.querySelector(`[data-ref="${ref}"]`);return el?el.getBoundingClientRect():null}
function fx(ref,text,kind){FXQ.push({ref,text,kind,rect:rectOf(ref)})}

function draw(side,n){const T=S[side];for(let i=0;i<n;i++){
  if(!T.deck.length){T.fatigue++;damage(side+':H',T.fatigue,null);log(`${HEROES[side].short}: Stapel leer, ${T.fatigue} Erschöpfungsschaden.`);continue}
  const id=T.deck.pop();if(T.hand.length>=10){log(`${C[id].n} verbrennt – die Hand ist voll.`);continue}
  T.hand.push({iid:S.uid++,id})}}
function summon(side,id){const T=S[side];if(T.board.length>=7)return null;const c=C[id],k=c.kw||[];
  const m={uid:S.uid++,id,atk:c.a,hp:c.h,max:c.h,taunt:k.includes('taunt'),charge:k.includes('charge'),shield:k.includes('shield'),poison:k.includes('poison'),life:k.includes('life'),sick:true,att:1};
  T.board.push(m);NEW.add(m.uid);return m}
function damage(ref,n,src){if(n<=0)return 0;const e=ent(ref);if(!e)return 0;
  if(!isHero(ref)&&e.shield){e.shield=false;fx(ref,'Schleier','shield');return 0}
  e.hp-=n;fx(ref,'−'+n,'dmg');
  if(!isHero(ref)&&src&&src.poison)e.dead=true;
  if(src&&src.life)heal(src.side+':H',n);
  return n}
function heal(ref,n){const e=ent(ref);if(!e)return;const before=e.hp;e.hp=Math.min(e.max,e.hp+n);if(e.hp>before)fx(ref,'+'+(e.hp-before),'heal')}
function canAttack(side,m){return S.turn===side&&m.att>0&&m.atk>0&&(!m.sick||m.charge)}
function attackTargets(aRef){const o=opp(aRef[0]),taunts=S[o].board.filter(m=>m.taunt);
  if(taunts.length)return taunts.map(m=>o+':'+m.uid);return[o+':H',...S[o].board.map(m=>o+':'+m.uid)]}
function validTargets(side,spec){const o=opp(side),mins=s=>S[s].board.map(m=>s+':'+m.uid);
  switch(spec){case'any':return['p:H','e:H',...mins('p'),...mins('e')];case'minion':return[...mins('p'),...mins('e')];case'friendly':return mins(side);case'enemyMinion':return mins(o)}return[]}

function runFx(f,side,target,srcM){const o=opp(side),src={side,life:srcM?srcM.life:false,poison:false};
  const pick=a=>a[Math.random()*a.length|0];
  switch(f.fx){
    case'dmg':damage(target,f.n,src);break;
    case'randEnemy':damage(pick([o+':H',...S[o].board.map(m=>o+':'+m.uid)]),f.n,src);break;
    case'buffRandFriend':{const pool=S[side].board.filter(m=>m!==srcM);if(pool.length){const m=pick(pool);m.atk+=f.a;m.hp+=f.h;m.max+=f.h;fx(side+':'+m.uid,`+${f.a}/+${f.h}`,'buff')}break}
    case'draw':draw(side,f.n);break;
    case'heal':heal(side+':H',f.n);break;
    case'summon':for(let i=0;i<f.k;i++)summon(side,f.tok);break;
    case'aoe':{let refs=[];const mins=s=>S[s].board.map(m=>s+':'+m.uid);
      if(f.scope==='enemyMinions')refs=mins(o);else if(f.scope==='allMinions')refs=[...mins('p'),...mins('e')];
      else if(f.scope==='other')refs=[...mins('p'),...mins('e')].filter(r=>!srcM||r!==side+':'+srcM.uid);
      else if(f.scope==='enemies')refs=[o+':H',...mins(o)];
      refs.forEach(r=>damage(r,f.n,src));break}
    case'destroy':{const m=ent(target);if(m){m.dead=true;fx(target,'Vernichtet','shield')}break}
    case'buff':{const m=ent(target);if(m){m.atk+=f.a;m.hp+=f.h;m.max+=f.h;fx(target,`+${f.a}/+${f.h}`,'buff')}break}
    case'drain':damage(target,f.n,src);heal(side+':H',f.n);break;
    case'pact':damage(side+':H',f.n,null);draw(side,f.d);break;
    case'mana':S[side].mana=Math.min(10,S[side].mana+1);break;
  }}
function resolveDeaths(){for(let g=0;g<12;g++){let any=false;
  for(const side of['p','e']){const dead=S[side].board.filter(m=>m.hp<=0||m.dead);if(!dead.length)continue;any=true;
    dead.forEach(m=>{const r=rectOf(side+':'+m.uid);if(r)GHOSTS.push(r)});
    S[side].board=S[side].board.filter(m=>!(m.hp<=0||m.dead));
    dead.forEach(m=>{const c=C[m.id];if(c.dr)runFx(c.dr,side,null,m)})}
  if(!any)break}
  if(!S.over&&(S.p.hp<=0||S.e.hp<=0))S.over=S.p.hp<=0&&S.e.hp<=0?'draw':S.p.hp<=0?'lose':'win'}

async function commit(wait=320){render();playFx();if(S.over){await sleep(700);showEnd();return}await sleep(wait)}
async function playCard(side,iid,target){const T=S[side],i=T.hand.findIndex(h=>h.iid===iid);if(i<0)return;const id=T.hand[i].id,c=C[id];
  T.mana-=c.c;T.hand.splice(i,1);log(`${HEROES[side].short} spielt ${c.n}.`);
  if(isM(c)){const m=summon(side,id);render();await sleep(260);if(c.bc&&m)runFx(c.bc,side,null,m)}
  else runFx(c.fx,side,target,null);
  resolveDeaths();await commit()}
async function attack(aRef,tRef){const A=ent(aRef),T=ent(tRef);if(!A||!T)return;
  await lunge(aRef,tRef);
  log(`${C[A.id].n} greift ${isHero(tRef)?HEROES[tRef[0]].short:C[T.id].n} an.`);
  damage(tRef,A.atk,{side:aRef[0],life:A.life,poison:A.poison});
  if(!isHero(tRef))damage(aRef,T.atk,{side:tRef[0],life:T.life,poison:T.poison});
  A.att--;resolveDeaths();await commit(380)}
function usePower(side,target){const T=S[side];T.mana-=2;T.power=true;
  if(side==='p'){log(`Glutstich trifft ${isHero(target)?HEROES[target[0]].short:C[ent(target).id].n}.`);damage(target,1,{side})}
  else{log('Der Hohle König ruft einen Knochenknecht.');summon('e','knecht')}}

async function startTurn(side){S.turn=side;const T=S[side];T.maxMana=Math.min(10,T.maxMana+1);T.mana=T.maxMana;T.power=false;T.board.forEach(m=>{m.sick=false;m.att=1});

function aiSpell(c){const P=S.p,E=S.e,f=c.fx,pm=P.board;
  const killable=n=>pm.filter(m=>m.hp<=n&&!m.shield).sort((a,b)=>val(b)-val(a))[0];
  switch(f.fx){
    case'dmg':case'drain':{if(c.tg==='any'&&P.hp<=f.n)return{ok:1,t:'p:H'};const k=killable(f.n);if(k)return{ok:1,t:'p:'+k.uid};
      if(c.tg==='any')return{ok:1,t:'p:H'};const big=[...pm].sort((a,b)=>b.atk-a.atk)[0];return big&&big.atk>=3?{ok:1,t:'p:'+big.uid}:{ok:0}}
    case'destroy':{const b=[...pm].sort((a,b)=>val(b)-val(a))[0];return b&&val(b)>=7?{ok:1,t:'p:'+b.uid}:{ok:0}}
    case'buff':{const b=[...E.board].sort((a,b)=>b.atk-a.atk)[0];return b?{ok:1,t:'e:'+b.uid}:{ok:0}}
    case'aoe':if(f.scope==='enemyMinions')return{ok:pm.length>=2};return{ok:pm.reduce((s,m)=>s+val(m),0)-E.board.reduce((s,m)=>s+val(m),0)>=6};
    case'pact':return{ok:E.hp>12&&E.hand.length<8};
    case'heal':return{ok:E.hp<=24};
    case'summon':return{ok:E.board.length<=5};
    case'mana':return{ok:E.hand.some(h=>h.id!=='muenze'&&C[h.id].c===E.mana+1)&&E.mana<10};
  }return{ok:0}}
function aiChoose(){const E=S.e;let best=null;
  for(const h of E.hand){const c=C[h.id];if(c.c>E.mana)continue;let t=null;
    if(isM(c)){if(E.board.length>=7)continue}else{const r=aiSpell(c);if(!r.ok)continue;t=r.t||null}
    const score=c.c*10+(isM(c)?1:0)+(h.id==='muenze'?-5:0);
    if(!best||score>best.score)best={iid:h.iid,id:h.id,t,score}}
  if(best&&best.id==='muenze'&&!E.hand.some(h=>h.id!=='muenze'&&C[h.id].c<=E.mana&&(isM(C[h.id])||aiSpell(C[h.id]).ok)))return best;
  if(best&&best.id==='muenze'){const other=E.hand.filter(h=>h.id!=='muenze'&&C[h.id].c<=E.mana);if(other.length){}}
  return best}
function aiAttackTarget(m){const ref='e:'+m.uid,tg=attackTargets(ref),P=S.p;const taunts=P.board.filter(x=>x.taunt);

  const ready=S.e.board.filter(x=>canAttack('e',x)).reduce((s,x)=>s+x.atk,0);if(ready>=P.hp)return'p:H';
  let best=null,bs=0;for(const t of P.board){const kill=(m.atk>=t.hp||m.poison)&&!t.shield,live=t.atk<m.hp||m.shield;let s=0;
    if(kill&&live)s=10+val(t);else if(kill&&val(t)>val(m)+1)s=5+val(t)-val(m);if(s>bs){bs=s;best=t}}
  return best?'p:'+best.uid:(tg.includes('p:H')?'p:H':tg[0])}
async function aiTurn(){busy=true;render();await sleep(800);const E=S.e;

    for(const q of opps){const h=[];for(let k=0;k<q.hole.length;k++)h.push(take());list.push(entry([...h,...board]))}

const WK_D={ratte:'a swarm of ash-covered rats in a burned village',kerze:'a hooded woman carrying a single candle through a dark crypt',knecht:'a skeletal servant in rusted chains',ghul:'a ghoul crawling out of a fresh grave',hexe:'a swamp witch with glowing green eyes under a dead tree',eisen:'an armored gate guard in heavy iron plate before a gothic gate',wolf:'a crypt wolf with glowing eyes among tombstones',egel:'a gaunt priest covered in leeches performing a blood ritual',pest:'a plague doctor messenger walking through a misty dead town',kraehe:'a gallows crow swooping down from a noose',schleier:'a knight wrapped in a ghostly glowing veil',sammler:'a corpse collector pulling a cart of bodies',grab:'a towering stone golem built from gravestones',haendler:'a sinister soul merchant holding glowing orbs',seherin:'a pale seer with white eyes under a full moon',reiter:'a shadow rider on a skeletal horse',gargyl:'a stone gargoyle on a cathedral tower at night',koloss:'a giant swamp colossus of mud and roots',sense:'a reaper of ash with a burning scythe',koenig:'the drowned king, a crowned corpse rising from black water',wyrm:'a colossal dragon against a violet dusk sky',funke:'a single ember igniting in a dark open hand',segen:'a skull blessed with a glowing golden halo on an altar',pfeil:'a cursed arrow trailing violet lightning',opfer:'a ritual dagger dripping blood over a stone altar',tau:'moon dew glowing on silver leaves under a full moon',ruf:'the dead rising from graves at a cemetery gate',sturm:'a storm of burning ash engulfing a ruined tower',ernte:'a soul ripped from a body as streams of red light',verdamm:'lightning striking a doomed tower',brand:'a whole city consumed by an inferno',muenze:'an old gold coin engraved with a skull lying on a grave'};
const WK_H={p:'the Ash Widow, a veiled sorceress in black robes with embers swirling around her',e:'the Hollow King, an undead king on a throne of bones with a cold blue glowing gaze'};
const WK_GROUPS=[{n:'Sonnenwacht',k:0},{n:'Aschelande',k:1},{n:'Nordmark',k:2},{n:'Blutmoor',k:3},{n:'Duell',k:4}];
let WK={g:3,busy:'',db:null,assets:null,raw:{}};
function wkSlots(g){if(g<4)return Object.keys(WK_CR).map(r=>({key:`pk-${r}-${g}`,label:`${r} · ${RN(+r)}`,sub:WK_CR[r]+'. Setting: '+WK_SET[g],thumb:()=>pcard({r:+r,s:g,id:r+'-'+g},92)}));
  return [...Object.keys(C).map(id=>({key:'d-'+id,label:C[id].n,sub:WK_D[id]+'. Setting: '+WK_DUEL_SET,thumb:()=>cardHTML(id,92,{mini:1})})),
    ...['p','e'].map(h=>({key:'h-'+h,label:HEROES[h].name,sub:WK_H[h]+'. Setting: '+WK_DUEL_SET,thumb:()=>`<div class="wk-hero"><img src="${ARTMAP['h-'+h]||HART[h]}" alt=""></div>`}))]}
function wkBatches(g){const sl=wkSlots(g),out=[];for(let i=0;i<sl.length;i+=13)out.push(sl.slice(i,i+13));return out}
function wkBatchPrompt(b){return`Create ${b.length} separate images, one after another, each a single illustration. Style for all: ${WK_BASE}\n\n`+b.map((x,i)=>`${i+1} ${x.sub}`).join('\n')}
function wkOne(x){return`${WK_BASE} ${x.sub}`}
function wkRender(){if(WK.reopen&&!$('#ov').hidden&&document.querySelector('.wk-box'))WK.reopen()}
function wkFind(key){for(let g=0;g<5;g++){const bs=wkBatches(g);for(let i=0;i<bs.length;i++){const x=bs[i].find(q=>q.key===key);if(x)return{g,bi:i,x,batch:bs[i]}}}return null}
function wkSection(key){const f=wkFind(key);if(!f)return'';const can=!!(WK.assets&&WK.db),has=!!ARTMAP[key],nb=wkBatches(f.g).length,grp=WK_GROUPS[f.g].n+(nb>1?` · Teil ${f.bi+1} von ${nb}`:''),done=f.batch.filter(q=>ARTMAP[q.key]).length;
  return`<div class="wk-box"><div class="wk-bt"><b>Kartenbild</b><span>${has?'eigenes Bild':'gezeichnet'}</span></div>${WK.busy?`<p class="wk-busy">${WK.busy}</p>`:''}
  <div class="wk-row"><button type="button" class="chip" data-wk="copy1" data-k="${key}">Prompt kopieren</button>${can?`<label class="chip wk-file">Eigenes Bild<input type="file" accept="image/*" data-wk="one" data-k="${key}"></label>${has?`<button type="button" class="chip" data-wk="del" data-k="${key}">Zurücksetzen</button>`:''}`:''}</div>
  <div class="wk-bt"><b>Alle ${f.batch.length} · ${grp}</b><span>${done} von ${f.batch.length} mit Bild</span></div>
  <div class="wk-row"><button type="button" class="chip" data-wk="copyb" data-k="${key}">Sammelprompt kopieren</button>${can?`<label class="chip wk-file">Alle zuordnen<input type="file" accept="image/*" multiple data-wk="multi" data-k="${key}"></label>`:''}</div>
  <p class="wk-hint">${can?'Sammelprompt in Gemini einfügen, die Bilder der Reihe nach speichern, dann „Alle zuordnen“ und alle auf einmal wählen.':'Eigene Bilder kann nur der Besitzer des Spiels hochladen. Den Prompt kannst du trotzdem kopieren.'}</p></div>`}
async function wkCopy(text,btn){const old=btn.textContent;try{await navigator.clipboard.writeText(text);btn.textContent='Kopiert'}catch(_){showOv(`<div class="help"><h3>Prompt</h3><textarea class="wk-ta" readonly>${text.replace(/</g,'&lt;')}</textarea><p>Text markieren und kopieren.</p><button type="button" class="btn" data-act="close">Fertig</button></div>`);const ta=document.querySelector('.wk-ta');if(ta){ta.focus();ta.select()}return}setTimeout(()=>{btn.textContent=old},1500)}
async function wkPrep(file){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const W=640,H=800,R=W/H;let sw=img.naturalWidth,sh=img.naturalHeight,sx=0,sy=0;if(sw/sh>R){const nw=sh*R;sx=(sw-nw)/2;sw=nw}else{const nh=sw/R;sy=(sh-nh)/2;sh=nh}
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;cv.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,W,H);
  return await new Promise(res=>cv.toBlob(res,'image/jpeg',.84))}finally{URL.revokeObjectURL(url)}}
async function wkStore(key,file){const blob=await wkPrep(file);const up=await WK.assets.upload(blob,{type:'image/jpeg'});
  const old=WK.raw[key];await WK.db.doc('art/'+key).set({a:up.id,t:Date.now()});ARTMAP[key]=up.url;WK.raw[key]=up.id;
  if(old&&old!==up.id){try{await WK.assets.delete(old)}catch(_){}}}
async function wkAssign(keys,files){if(!WK.assets||!WK.db)return;const fs=[...files].sort((a,b)=>a.lastModified-b.lastModified||a.name.localeCompare(b.name));
  const n=Math.min(keys.length,fs.length);for(let i=0;i<n;i++){WK.busy=`Speichere Bild ${i+1} von ${n} …`;wkRender();
    try{await wkStore(keys[i],fs[i])}catch(e){WK.busy=`Bild ${i+1} ging nicht: ${e&&e.code==='too_large'?'zu groß':e&&e.code==='quota_or_state'?'Speicher voll':'bitte nochmal versuchen'}.`;wkRender();return}}
  WK.busy=fs.length>keys.length?`${n} Bilder gespeichert. ${fs.length-keys.length} überzählige ignoriert.`:`${n} Bild${n>1?'er':''} gespeichert.`;wkRender();if(S)render();if(PK)pkRender()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-wk]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.wk;
  const f=wkFind(b.dataset.k||'');if(!f)return;
  if(a==='copyb')wkCopy(wkBatchPrompt(f.batch),b);
  else if(a==='copy1')wkCopy(wkOne(f.x),b);
  else if(a==='del'){const k=b.dataset.k,id=WK.raw[k];(async()=>{try{await WK.db.doc('art/'+k).delete();if(id)await WK.assets.delete(id)}catch(_){}delete ARTMAP[k];delete WK.raw[k];wkRender();if(S)render();if(PK)pkRender()})()}});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.wk||!t.files||!t.files.length)return;
  if(t.dataset.wk==='multi'){const f=wkFind(t.dataset.k);if(f)wkAssign(f.batch.map(x=>x.key),t.files)}else if(t.dataset.wk==='one')wkAssign([t.dataset.k],t.files);t.value=''});
(async()=>{try{if(!(await waitClaude())){WK.tried=1;return}
  const [db,as]=await Promise.all([window.claude.use('db'),window.claude.use('assets')]);WK.db=db;WK.assets=as;WK.tried=1;
  if(db){db.collection('art').onSnapshot(snap=>{const m={...ARTDEF},raw={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.a){m[d.id]='/_blob/'+v.a;raw[d.id]=v.a}});ARTMAP=m;WK.raw=raw;
    if(S)render();if(PK&&mode==='poker')pkRender();wkRender()},()=>{})}
  wkRender()}catch(err){console.warn("werkstatt",err);WK.tried=1;wkRender()}})();

/* ---------- Start ---------- */
try{window.claude?.hot?.snapshot?.(()=>({S:JSON.parse(JSON.stringify(S)),PK:PK?JSON.parse(JSON.stringify({...PK,hi:PK.hi?[...PK.hi]:null})):null,mode}))}catch(_){}
function start(data){layout();
  if(data&&data.S&&data.S.p){S=data.S;busy=false;sel=null;render();if(S.over)showEnd();else if(S.turn==='e')aiTurn()}
  else newGame();
  if(data&&data.PK&&data.PK.players&&data.PK.players[0]&&data.PK.players[0].aid!==undefined){PK=data.PK;PK.hi=PK.hi?new Set(PK.hi):null;}
  if(data&&data.mode==='poker'){setMode('poker');if(PK&&!PK.waiting&&(PK.phase==='bet'||PK.phase==='discard'))pkRun()}}
window.__t={get S(){return S},get PK(){return PK},setMode,pkHuman,strongest:ids=>{const e=strongest(ids.map(i=>CARDBY[i]));return [e.b.cat,e.five.map(c=>c.id).join(" ")]},diff:n=>{let d=0;for(let k=0;k<n;k++){const c=shuffle(FULL.slice()).slice(0,7);if(strongest(c).b.cat<eval5(bestPokerFive(c)).cat)d++}return d/n},sim:n=>{let same=0,tot=0;for(let k=0;k<n;k++){const d=shuffle(FULL.slice());const bd=d.slice(0,5),A=entry([d[5],d[6],...bd]),B=entry([d[7],d[8],...bd]);if(A.score===B.score)continue;const w=battle(A.team,B.team).w;if(w<0)continue;tot++;if((w===0)===(A.score>B.score))same++}return same/tot}};
const hot=window.claude?.hot;
try{if(typeof hot?.ready==='function')hot.ready(start);else start(hot?.data??{})}catch(err){start({})}
})();
</script>
